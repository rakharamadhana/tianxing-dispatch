name: Release installers

# Builds the Windows (.exe) and macOS (.dmg) installers and attaches them to a
# GitHub Release. Triggered when you push a version tag like "v0.1.0".
# macOS installers can only be built on a macOS runner — that's why this uses a
# build matrix, so you don't need your own Mac.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write # required to create/update the Release

jobs:
  release:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the app bundle
        run: npm run build

      - name: Package & publish Windows installer
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package & publish macOS installer
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false # unsigned build; skip signing lookup

  # After the installers are published, set the Release notes to this version's
  # section from CHANGELOG.md. Runs once (not per-OS). Best-effort: if it fails,
  # the installers are already published and downloadable.
  notes:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Copy CHANGELOG section into the Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the block under "## [VERSION]" up to the next "## [" heading.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag = 1; next }
            /^## \[/ { if (flag) exit }
            flag { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release ${GITHUB_REF_NAME}" > notes.md; fi
          gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
